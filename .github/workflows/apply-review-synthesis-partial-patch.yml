name: Apply review synthesis partial patch

on:
  pull_request:
    paths:
      - "scripts/apply_review_synthesis_partial_patch.py"
      - ".github/workflows/apply-review-synthesis-partial-patch.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Apply one-shot synthesis patch
        run: python scripts/apply_review_synthesis_partial_patch.py

      - name: Reject malformed diffs
        run: git diff --check

      - name: Install ClaimCI with test dependencies
        run: python -m pip install -e ".[dev,llm]"

      - name: Run review regression suite
        run: >-
          python -m pytest -q
          tests/test_review_*.py
          tests/test_analysis_review_bridge_v03.py

      - name: Compile Python sources
        run: python -m compileall -q claimci tests

      - name: Commit verified implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claimci tests README.md
          git commit -m "fix: preserve trusted state when advisory synthesis is invalid"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
