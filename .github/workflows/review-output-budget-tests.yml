name: Review output budget tests

on:
  pull_request:
    paths:
      - ".claimci/review.yaml"
      - "claimci/review/**"
      - "tests/test_review_*"
      - "tests/test_analysis_review_bridge_v03.py"
      - ".github/workflows/review-output-budget-tests.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  review-output-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reject malformed pull-request diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install ClaimCI with test dependencies
        run: python -m pip install -e ".[dev,llm]"

      - name: Run review regression suite
        run: >-
          python -m pytest -q
          tests/test_review_*.py
          tests/test_analysis_review_bridge_v03.py

      - name: Compile Python sources
        run: python -m compileall -q claimci tests
