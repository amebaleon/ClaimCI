name: ClaimCI external

on:
  workflow_call:
    inputs:
      manifest-path:
        description: Relative path to the research manifest in the consumer PR.
        required: false
        type: string
        default: research.yaml
      review-config-path:
        description: Relative path to trusted review config on the consumer base.
        required: false
        type: string
        default: .claimci/review.yaml
    secrets:
      OPENAI_API_KEY:
        required: false

permissions: {}

jobs:
  claimci_audit:
    name: ClaimCI Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out pull-request artifacts as passive data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install trusted ClaimCI
        uses: amebaleon/ClaimCI@1b85419c4beaf7052732339fd80fb9242e75ef06
        with:
          install-review-dependencies: false

      - name: Run deterministic audit
        id: audit
        shell: bash
        env:
          CLAIMCI_MANIFEST: ${{ inputs.manifest-path }}
        run: |
          set +e
          claimci audit "pull-request/$CLAIMCI_MANIFEST" --artifact-root pull-request --json > claimci-result.json
          json_status=$?
          claimci audit "pull-request/$CLAIMCI_MANIFEST" --artifact-root pull-request --markdown > claimci-summary.md
          markdown_status=$?
          set -e
          if [ ! -s claimci-result.json ]; then printf '%s\n' '{"verdict":"UNKNOWN"}' > claimci-result.json; fi
          if [ ! -s claimci-summary.md ]; then printf '%s\n' '## ClaimCI Audit' > claimci-summary.md; fi
          if [ "$json_status" -ne "$markdown_status" ]; then printf '%s\n' '{"verdict":"UNKNOWN"}' > claimci-result.json; fi
          cat claimci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build audit Check payload
        if: always()
        run: |
          details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -m claimci.github \
            --report claimci-result.json \
            --markdown claimci-summary.md \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --details-url "$details_url" \
            --output claimci-check.json || true
          if [ ! -s claimci-check.json ]; then
            jq -n \
              --arg head_sha "${{ github.event.pull_request.head.sha }}" \
              --arg details_url "$details_url" \
              '{name:"ClaimCI Audit",head_sha:$head_sha,status:"completed",conclusion:"failure",details_url:$details_url,output:{title:"ClaimCI Audit - integration failure",summary:"## ClaimCI Audit\n\n**FAILURE - the workflow could not produce a trustworthy audit report.**"}}' > claimci-check.json
          fi

      - name: Publish ClaimCI Audit Check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST --input claimci-check.json "repos/${GITHUB_REPOSITORY}/check-runs"

  research_review:
    name: ClaimCI Research Review
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      review_check_b64: ${{ steps.encode.outputs.review_check_b64 }}
    steps:
      - name: Check out trusted consumer base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: consumer-base
          persist-credentials: false
          fetch-depth: 0

      - name: Check out pull-request artifacts as passive review data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Resolve trusted review coordinates
        id: coordinates
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          requested_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          full_sha='^([0-9a-f]{40}|[0-9a-f]{64})$'
          if [[ ! "$requested_sha" =~ $full_sha ]] || [[ ! "$head_sha" =~ $full_sha ]]; then
            exit 1
          fi
          if [ "$(git -C consumer-base rev-parse --verify 'HEAD^{commit}')" != "$requested_sha" ] || \
             [ "$(git -C pull-request rev-parse --verify 'HEAD^{commit}')" != "$head_sha" ]; then
            exit 1
          fi
          # The exact base and fork head are separate passive checkouts. Expose
          # the head object store read-only while deriving from the trusted repo.
          pull_request_git_dir="$(git -C pull-request rev-parse --absolute-git-dir)"
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$pull_request_git_dir/objects"
          mapfile -t merge_bases < <(git -C consumer-base merge-base --all "$requested_sha" "$head_sha")
          if [ "${#merge_bases[@]}" -ne 1 ] || [[ ! "${merge_bases[0]}" =~ $full_sha ]]; then
            exit 1
          fi
          comparison_sha="${merge_bases[0]}"
          if [ "$comparison_sha" = "$requested_sha" ]; then
            comparison_basis=direct_base
            comparison_root=consumer-base
          else
            comparison_basis=merge_base
            comparison_root=comparison-base
          fi
          echo "requested_sha=$requested_sha" >> "$GITHUB_OUTPUT"
          echo "comparison_sha=$comparison_sha" >> "$GITHUB_OUTPUT"
          echo "comparison_basis=$comparison_basis" >> "$GITHUB_OUTPUT"
          echo "comparison_root=$comparison_root" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out explicit comparison base
        if: steps.coordinates.outputs.comparison_basis == 'merge_base'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.coordinates.outputs.comparison_sha }}
          path: comparison-base
          persist-credentials: false
          fetch-depth: 0

      # The review runtime is the immutable source containing this reusable
      # workflow, isolated from all consumer snapshot roots.
      - name: Check out immutable ClaimCI review runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: claimci-runtime
          persist-credentials: false

      - name: Validate immutable ClaimCI review runtime
        id: runtime_identity
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ job.workflow_sha }}"
          full_sha='^([0-9a-f]{40}|[0-9a-f]{64})$'
          if [[ ! "$expected_sha" =~ $full_sha ]]; then
            exit 1
          fi
          actual_sha="$(git -C claimci-runtime rev-parse --verify 'HEAD^{commit}')"
          if [ "$actual_sha" != "$expected_sha" ]; then
            exit 1
          fi

      - name: Set up Python for trusted review
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install immutable ClaimCI review carrier
        id: review_carrier
        if: always() && steps.runtime_identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python -m pip install --disable-pip-version-check ./claimci-runtime

      - name: Validate immutable ClaimCI review CLI contract
        id: runtime_contract
        if: always() && steps.review_carrier.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          review_help="$(claimci review --help)"
          for option in \
            --preflight-only \
            --requested-base-root \
            --comparison-base-root \
            --requested-base-sha \
            --comparison-base-sha \
            --comparison-basis \
            --head-sha
          do
            grep -F -- "$option" <<<"$review_help" >/dev/null
          done

      - name: Probe trusted review configuration
        id: review_config
        if: always()
        shell: bash
        env:
          REVIEW_CONFIG_PATH: ${{ inputs.review-config-path }}
        run: |
          set +e
          enabled="$(python - <<'PY'
          import os
          from pathlib import Path

          from claimci.review.config import load_review_config

          try:
              config = load_review_config(
                  Path("consumer-base"),
                  Path(os.environ["REVIEW_CONFIG_PATH"]),
              )
              print("true" if config.enabled else "false")
          except Exception:
              print("false")
          PY
          )"
          case "$enabled" in true|false) ;; *) enabled=false ;; esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run free providerless review preflight
        id: preflight
        if: always() && steps.runtime_contract.outcome == 'success' && steps.review_config.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          REVIEW_CONFIG_PATH: ${{ inputs.review-config-path }}
        run: |
          rm -f claimci-review-preflight.json claimci-review-preflight.md
          set +e
          claimci review pull-request \
            --requested-base-root consumer-base \
            --comparison-base-root "${{ steps.coordinates.outputs.comparison_root || 'consumer-base' }}" \
            --requested-base-sha "${{ steps.coordinates.outputs.requested_sha || '0000000000000000000000000000000000000000' }}" \
            --comparison-base-sha "${{ steps.coordinates.outputs.comparison_sha || '0000000000000000000000000000000000000000' }}" \
            --comparison-basis "${{ steps.coordinates.outputs.comparison_basis || 'direct_base' }}" \
            --head-sha "${{ steps.coordinates.outputs.head_sha || '0000000000000000000000000000000000000000' }}" \
            --config-root consumer-base \
            --config "$REVIEW_CONFIG_PATH" \
            --event-json "$GITHUB_EVENT_PATH" \
            --preflight-only \
            --json-output claimci-review-preflight.json \
            --markdown-output claimci-review-preflight.md
          preflight_status=$?
          set -e
          ready=false
          if [ "$preflight_status" -eq 0 ] && [ -s claimci-review-preflight.json ]; then
            ready="$(python - <<'PY'
          import json
          from pathlib import Path

          try:
              value = json.loads(Path("claimci-review-preflight.json").read_text(encoding="utf-8"))
              ready = value.get("preflight", {}).get("ready_for_provider") is True
          except Exception:
              ready = False
          print("true" if ready else "false")
          PY
          )" || ready=false
          fi
          case "$ready" in true|false) ;; *) ready=false ;; esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "preflight_status=$preflight_status" >> "$GITHUB_OUTPUT"

      - name: Install optional review dependencies
        id: review_sdk
        if: always() && steps.preflight.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: python -m pip install --disable-pip-version-check "./claimci-runtime[llm]"

      - name: Run optional research review
        id: review
        if: always() && steps.preflight.outputs.ready == 'true' && steps.review_sdk.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_CONFIG_PATH: ${{ inputs.review-config-path }}
        run: |
          rm -f claimci-review-paid.json claimci-review-paid.md
          set +e
          claimci review pull-request \
            --requested-base-root consumer-base \
            --comparison-base-root "${{ steps.coordinates.outputs.comparison_root || 'consumer-base' }}" \
            --requested-base-sha "${{ steps.coordinates.outputs.requested_sha || '0000000000000000000000000000000000000000' }}" \
            --comparison-base-sha "${{ steps.coordinates.outputs.comparison_sha || '0000000000000000000000000000000000000000' }}" \
            --comparison-basis "${{ steps.coordinates.outputs.comparison_basis || 'direct_base' }}" \
            --head-sha "${{ steps.coordinates.outputs.head_sha || '0000000000000000000000000000000000000000' }}" \
            --config-root consumer-base \
            --config "$REVIEW_CONFIG_PATH" \
            --event-json "$GITHUB_EVENT_PATH" \
            --json-output claimci-review-paid.json \
            --markdown-output claimci-review-paid.md
          review_status=$?
          set -e
          echo "review_status=$review_status" >> "$GITHUB_OUTPUT"

      - name: Ensure advisory review artifacts
        if: always()
        shell: bash
        env:
          PREFLIGHT_READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.preflight_status }}
          REVIEW_SDK_OUTCOME: ${{ steps.review_sdk.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          PAID_STATUS: ${{ steps.review.outputs.review_status }}
        run: |
          set -euo pipefail
          rm -f claimci-review.json claimci-review.md
          selected=false
          if [ "${PREFLIGHT_READY:-}" = "true" ]; then
            if [ "${PREFLIGHT_STATUS:-}" = "0" ] && \
               [ "${REVIEW_SDK_OUTCOME:-}" = "success" ] && \
               [ "${REVIEW_OUTCOME:-}" = "success" ] && \
               [ "${PAID_STATUS:-}" = "0" ] && \
               [ -s claimci-review-paid.json ] && \
               [ -s claimci-review-paid.md ]; then
              cp claimci-review-paid.json claimci-review.json
              cp claimci-review-paid.md claimci-review.md
              selected=true
            fi
          elif [ "${PREFLIGHT_STATUS:-}" = "0" ] && \
               [ -s claimci-review-preflight.json ] && \
               [ -s claimci-review-preflight.md ]; then
            cp claimci-review-preflight.json claimci-review.json
            cp claimci-review-preflight.md claimci-review.md
            selected=true
          fi
          if [ "$selected" != "true" ]; then
            printf '%s\n' '{"schema_version":2,"review":{"status":"UNAVAILABLE","policy":"advisory","blocking":false}}' > claimci-review.json
            {
              echo '## ClaimCI Research Review (Advisory)'
              echo
              echo '**Review unavailable; no advisory Markdown was produced.**'
              echo
              echo 'Only the separate deterministic ClaimCI Audit can block a pull request.'
            } > claimci-review.md
          fi
          cat claimci-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build advisory Review Check payload
        if: always()
        shell: bash
        run: |
          set +e
          python -m claimci.review.github \
            --review-json claimci-review.json \
            --markdown claimci-review.md \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --details-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output claimci-review-check.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ ! -s claimci-review-check.json ]; then
            jq -n \
              --arg head_sha "${{ github.event.pull_request.head.sha }}" \
              --arg details_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{name:"ClaimCI Research Review",head_sha:$head_sha,status:"completed",conclusion:"neutral",details_url:$details_url,output:{title:"ClaimCI Research Review - advisory",summary:"## ClaimCI Research Review (Advisory)\n\nReview unavailable; the optional advisory integration could not render a review."}}' > claimci-review-check.json
          fi

      - name: Encode advisory payload
        id: encode
        if: always()
        shell: bash
        run: |
          payload_b64=""
          if [ -s claimci-review-check.json ]; then
            payload_b64="$(base64 -w 0 claimci-review-check.json 2>/dev/null || true)"
            if [ -z "$payload_b64" ]; then
              payload_b64="$(base64 claimci-review-check.json | tr -d '\n')"
            fi
          fi
          if [ "${#payload_b64}" -gt 100000 ]; then
            payload_b64=""
          fi
          echo "review_check_b64=$payload_b64" >> "$GITHUB_OUTPUT"

  publish_research_review:
    name: Publish ClaimCI Research Review
    if: always()
    continue-on-error: true
    needs: [claimci_audit, research_review]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_CHECK_B64: ${{ needs.research_review.outputs.review_check_b64 }}
    steps:
      - name: Publish bounded neutral Review Check
        shell: bash
        run: |
          set +e
          payload_b64="${REVIEW_CHECK_B64:-}"
          decode_status=1
          payload_bytes=""
          if [ "${#payload_b64}" -le 100000 ] && [ -n "$payload_b64" ]; then
            printf '%s' "$payload_b64" | base64 --decode > claimci-review-check.json
            decode_status=$?
          fi
          summary_bytes=""
          if [ "$decode_status" -eq 0 ] && [ -s claimci-review-check.json ]; then
            payload_bytes="$(wc -c < claimci-review-check.json | tr -d '[:space:]')"
            summary_bytes="$(jq -j '.output.summary' claimci-review-check.json 2>/dev/null | wc -c | tr -d '[:space:]')"
          fi
          if [ "$decode_status" -ne 0 ] || [ ! -s claimci-review-check.json ] || \
             [ -z "$payload_bytes" ] || [ "$payload_bytes" -gt 100000 ] || \
             [ -z "$summary_bytes" ] || [ "$summary_bytes" -gt 60000 ] || \
             ! jq -e \
               --arg head_sha "${{ github.event.pull_request.head.sha }}" \
               --arg details_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               'type == "object" and (keys | sort) == (["conclusion", "details_url", "head_sha", "name", "output", "status"] | sort) and .name == "ClaimCI Research Review" and .head_sha == $head_sha and .status == "completed" and .conclusion == "neutral" and .details_url == $details_url and (.output | type == "object") and (.output | keys | sort) == (["summary", "title"] | sort) and .output.title == "ClaimCI Research Review - advisory" and (.output.summary | type == "string")' \
               claimci-review-check.json >/dev/null 2>&1; then
            jq -n \
              --arg head_sha "${{ github.event.pull_request.head.sha }}" \
              --arg details_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{name:"ClaimCI Research Review",head_sha:$head_sha,status:"completed",conclusion:"neutral",details_url:$details_url,output:{title:"ClaimCI Research Review - advisory",summary:"## ClaimCI Research Review (Advisory)\n\nReview unavailable; the optional advisory integration could not render a review."}}' > claimci-review-check.json
          fi
          set -e
          gh api --method POST --input claimci-review-check.json "repos/${GITHUB_REPOSITORY}/check-runs"
